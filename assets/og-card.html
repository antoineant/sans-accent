<!doctype html>
<!-- Share image (1200x630) for sans-accent.com. Rendered by assets/build_og.sh: og-card.html?lang=fr|en -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500..800&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f6f7fa; color: #151a33; font-family: "Literata", Georgia, serif; font-optical-sizing: auto;
         display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; margin-bottom: 44px; }
  .brand img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 84px; line-height: 1.05; font-weight: 750; letter-spacing: -0.02em; max-width: 15ch; }
  .accent { color: #d62839; }
  p { margin: 34px 0 0; font-size: 32px; color: #565c75; }
</style></head>
<body>
  <div class="brand"><img src="icon-512.png" alt="">Sans-Accent</div>
  <h1 id="title"></h1>
  <p id="line"></p>
  <script>
    const fr = new URLSearchParams(location.search).get("lang") !== "en";
    document.documentElement.lang = fr ? "fr" : "en";
    document.getElementById("title").innerHTML = fr
      ? 'Tapez sans accents, <span class="accent">é</span>crivez sans fautes.'
      : "Type without accents, write without mistakes.";
    document.getElementById("line").textContent = fr
      ? "Sans-Accent ajoute les accents quand vous tapez sur un Mac QWERTY."
      : "Sans-Accent adds French accents as you type on a QWERTY Mac.";
  </script>
</body></html>
